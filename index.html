<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F7FAFA">
    <link rel="icon" type="image/png" href="logifera-icon.png">
    <title>Array Architects · Logifera</title>
    <style>
      * { box-sizing:border-box; }
      html,body { margin:0;width:100%;height:100%;overflow:hidden; }
      body { display:flow-root;height:100dvh;overflow:hidden;background:#EAF6F3;color:#243746;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
      .shell { width:min(1480px,calc(100% - 40px));height:calc(100dvh - 32px);margin:16px auto;min-height:0; }
      main,array-architects { display:block;height:100%;min-height:0; }
      @media(max-width:700px) { .shell { width:calc(100% - 16px);height:calc(100dvh - 16px);margin:8px auto; } }
    </style>
    <script defer src="intervention-core.js"></script>
    <script defer src="adaptive-engine.js"></script>
    <script defer src="telemetry.js"></script>
    <script defer src="array-architects.js"></script>
  </head>
  <body>
    <div class="shell">
      <main><array-architects></array-architects></main>
    </div>
    <noscript>This game needs JavaScript enabled.</noscript>
  </body>
</html>
